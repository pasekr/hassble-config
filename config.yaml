version: 1

defaults:
  publish:
    on_change_only: true
    min_interval: 10s

devices:
  - id: "obd_link_cx"
    name: "OBDlink CX"
    source: "obd"
    obd:
      tx_delay: 50ms
      init_commands:
        - "ATSP6"
sensors:
        - key: "speed"
          device_class: "speed"
          unit: "km/h"
          state_class: "measurement"
          icon: "mdi:speedometer"
          accuracy_decimals: 0
          preset: "speed"
          pid: "0D"
          formula: "a"
          update_interval: "1s"

        - key: "battery_voltage"
          device_class: "voltage"
          unit: "V"
          state_class: "measurement"
          accuracy_decimals: 2
          preset: "battery_voltage"
          pid: "42"
          formula: "(a*256+b)/1000"
          update_interval: "10s"

        - key: "battery_soc_real"
          device_class: "battery"
          unit: "%"
          state_class: "measurement"
          accuracy_decimals: 1
          mode: "22"
          pid: "028C"
          pre_commands: ["ATSH7E4"]
          formula: "a*0.39215686"
          update_interval: "10s"

        - key: "battery_soc_display"
          device_class: "battery"
          unit: "%"
          state_class: "measurement"
          accuracy_decimals: 1
          mode: "22"
          pid: "1002"
          pre_commands: ["ATSH7E4"]
          formula: "a*0.5"
          update_interval: "10s"

        - key: "hv_battery_voltage"
          device_class: "voltage"
          unit: "V"
          state_class: "measurement"
          accuracy_decimals: 1
          mode: "22"
          pid: "1E3B"
          pre_commands: ["ATSH7E4"]
          formula: "(a*256+b)*0.25"
          update_interval: "5s"

        - key: "hv_battery_current"
          device_class: "current"
          unit: "A"
          state_class: "measurement"
          accuracy_decimals: 1
          mode: "22"
          pid: "1E3D"
          pre_commands: ["ATSH7E4"]
          formula: "((a*256+b)-15000)*0.1"
          update_interval: "2s"

        - key: "battery_temp_min"
          device_class: "temperature"
          unit: "°C"
          state_class: "measurement"
          accuracy_decimals: 1
          mode: "22"
          pid: "1E0E"
          pre_commands: ["ATSH7E4"]
          formula: "a-40"
          update_interval: "30s"

        - key: "battery_temp_max"
          device_class: "temperature"
          unit: "°C"
          state_class: "measurement"
          accuracy_decimals: 1
          mode: "22"
          pid: "1E0F"
          pre_commands: ["ATSH7E4"]
          formula: "a-40"
          update_interval: "30s"

        - key: "odometer"
          device_class: "distance"
          unit: "km"
          state_class: "total_increasing"
          accuracy_decimals: 0
          icon: "mdi:counter"
          mode: "22"
          pid: "2203"
          pre_commands: ["ATSH17FC007B"]
          formula: "(a*16777216+b*65536+c*256+d)/10"
          update_interval: "120s"
