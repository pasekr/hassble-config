devices:
  - id: obd_link_cx
    name: "OBDlink CX"
    source: obd
    obd:
      tx_delay: 500ms
      init_commands:
        - "ATSP6"
        - "ATSTFF"
    sensors:
      - key: "battery_soc_real"
        device_class: battery
        unit: "%"
        state_class: measurement
        accuracy_decimals: 1

        mode: "22"
        pid: "028C"

        pre_commands:
          - "ATSH7E4"

        formula: "a*0.39215686"

        update_interval: 15s
