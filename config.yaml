# HassBle Configuration File — Volkswagen ID.4 (VAG MEB)
version: 1

defaults:
  publish:
    on_change_only: true
    min_interval: 10s

devices:
  # ──────────────────────────────────────────────────────────────
  # Vehicle OBD-II (ELM327 over BLE) — Volkswagen ID.4
  # ──────────────────────────────────────────────────────────────
  - id: id4_obd
    name: "VW ID.4 OBD"
    source: obd
    obd:
      # MAC adresu můžete zadat přímo sem nebo ji spárovat v aplikaci
      # mac: "AA:BB:CC:DD:EE:FF"
      service_uuid: "18F0"
      tx_char_uuid: "2AF1"
      rx_char_uuid: "2AF0"
      tx_delay: 50ms
      init_commands:
        - "ATZ"       # Reset adaptérů
        - "ATE0"      # Vypnutí ozvěny
        - "ATL0"      # Vypnutí odřádkování
        - "ATS0"      # Vypnutí mezer
        - "ATH0"      # Vypnutí hlaviček
        - "ATSP6"     # Protokol: ISO 15765-4 CAN (11bit ID, 500kbaud)
      default_commands:
        - "ATSH7DF"   # Výchozí všesměrová OBD hlavička

    sensors:
      # ── Standardní OBD-II senzory ──
      - { key: speed, preset: speed, update_interval: 2s }
      - { key: battery_12v, preset: battery_voltage, update_interval: 10s }

      # ── Vysokonapěťová baterie (BMS ECU: 7E4) ──
      - key: battery_soc_real
        mode: "22"
        pid: "028C"
        pre_commands: ["ATSH7E4"]
        formula: "a * 0.39215686"
        unit: "%"
        device_class: battery
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 10s

      - key: battery_soc_display
        mode: "22"
        pid: "1002"
        pre_commands: ["ATSH7E4"]
        formula: "a * 0.5"
        unit: "%"
        device_class: battery
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 10s

      - key: hv_battery_voltage
        mode: "22"
        pid: "1E3B"
        pre_commands: ["ATSH7E4"]
        formula: "(a * 256 + b) * 0.25"
        unit: "V"
        device_class: voltage
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 5s

      - key: hv_battery_current
        mode: "22"
        pid: "1E3D"
        pre_commands: ["ATSH7E4"]
        formula: "((a * 256 + b) - 15000) * 0.1"
        unit: "A"
        device_class: current
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 2s

      - key: battery_temp_min
        mode: "22"
        pid: "1E0E"
        pre_commands: ["ATSH7E4"]
        formula: "a - 40"
        unit: "°C"
        device_class: temperature
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 30s

      - key: battery_temp_max
        mode: "22"
        pid: "1E0F"
        pre_commands: ["ATSH7E4"]
        formula: "a - 40"
        unit: "°C"
        device_class: temperature
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 30s

      # ── Nájezd a telemetrie ──
      - key: odometer
        mode: "22"
        pid: "2203"
        pre_commands: ["ATSH17FC007B"]
        formula: "(a * 16777216 + b * 65536 + c * 256 + d) / 10"
        unit: "km"
        device_class: distance
        state_class: total_increasing
        accuracy_decimals: 0
        icon: "mdi:counter"
        update_interval: 120s
        publish:
          deadband: 1.0
          min_interval: 60s
