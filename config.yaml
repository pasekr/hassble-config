version: 1

devices:
  - id: "obd_link_cx"
    name: "OBDlink CX"
    source: obd
    obd:
      tx_delay: 100ms
      init_commands:
        - "ATZ"
        - "ATE0"
        - "ATL0"
        - "ATS0"
        - "ATH0"
        - "ATSP6"
        - "ATCRA 7E8"
        - "ATSH7E4"
    sensors:
      - key: battery_soc_real
        mode: "22"
        pid: "028C"
        formula: "a*0.39215686"
        unit: "%"
        device_class: battery
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 10s
