version: 1

devices:
  - id: "id4_obdlink_cx"
    name: "VW ID.4 OBDLink CX"
    source: "obd"

    obd:
      tx_delay: 50ms
      init_commands:
        - "ATSP7"
        - "ATSHFC007B"
        - "ATCP17"
        - "ATCRA17FE007B"
        - "ATFCSH17FC007B"
        - "STCFCPA17FC007B,17FE007B"
        - "ATFCSM1"

    sensors:
      - key: "battery_soc"
        mode: "22"
        pid: "028C"

        # Response: 62 02 8C BC
        # Offset 3 selects BC = 188.
        # 188 * 0.448 - 7.16 = 77.104 %
        # decode is used instead of formula to avoid the locale
        # decimal-comma NumberFormatException seen in HassBle.
        decode:
          offset: 0
          length: 1
          type: uint8
          scale: 0.448
          offset_value: -7.16

        unit: "%"
        device_class: battery
        state_class: measurement
        accuracy_decimals: 1
        icon: "mdi:battery-high"
        update_interval: 10s

        pre_commands:
          - "ATSHFC007B"
          - "ATCP17"
          - "ATCRA17FE007B"
          - "ATFCSH17FC007B"
          - "STCFCPA17FC007B,17FE007B"
          - "ATFCSM1"
