devices:
  - id: obd_vehicle
    name: OBDlink CX
    source: obd
    obd: {}

    sensors:
      - key: battery_soc_real
        device_class: battery
        unit: "%"
        state_class: measurement
        accuracy_decimals: 1
        mode: "22"
        pid: "028C"
        formula: "a*0.39215686"
        update_interval: "10s"
        pre_commands:
          - "ATSH7E4"
