templates:
  - id: obd_link_cx
    name: "OBDlink CX (VW ID.4 GTX)"
    description: "SoC a data baterie pro MEB platformu přes ECU 7E4"
    device:
      id: obd_vehicle
      name: "OBDlink CX"
      source: obd
      obd:
      tx_delay: 50ms
      init_commands:
        - "ATSP7"
        - "ATSHFC007B"
        - "ATCP17"
        - "ATCRA17FE007B"
        - "ATFCSH17FC007B"
        - "STCFCPA17FC007B,17FE007B"
        
      sensors:

        # ID.4 – skutečný SoC baterie
        - key: "battery_soc"
          mode: "22"
          pid: "028C"
          formula: "a"
          unit: ""
          device_class: battery
          state_class: measurement
          accuracy_decimals: 0
          icon: "mdi:battery-high"
          update_interval: 10s
          pre_commands:
            - "ATSHFC007B"
            - "ATCP17"
            - "ATCRA17FE007B"
            - "ATFCSH17FC007B"
            - "STCFCPA17FC007B,17FE007B"
          
        # ID.4 – SoC zobrazovaný vozem
        - key: battery_soc_display
          device_class: battery
          state_class: measurement
          accuracy_decimals: 0
          mode: "22"
          pid: "1002"
          formula: "a"
          unit: ""
          update_interval: 10s
          pre_commands:
            - "ATSHFC007B"
            - "ATCP17"
            - "ATCRA17FE007B"
            - "ATFCSH17FC007B"
            - "STCFCPA17FC007B,17FE007B"

        # ID.4 – napětí HV baterie
        - key: hv_battery_voltage
          device_class: voltage
          state_class: measurement
          accuracy_decimals: 0
          mode: "22"
          pid: "1E3B"
          formula: "a"
          unit: ""
          update_interval: 5s
          pre_commands:
            - "ATSHFC007B"
            - "ATCP17"
            - "ATCRA17FE007B"
            - "ATFCSH17FC007B"
            - "STCFCPA17FC007B,17FE007B"

        # ID.4 – proud HV baterie
        - key: hv_battery_current
          device_class: current
          state_class: measurement
          accuracy_decimals: 0
          mode: "22"
          pid: "1E3D"
          formula: "a"
          unit: ""
          update_interval: 2s
          pre_commands:
            - "ATSHFC007B"
            - "ATCP17"
            - "ATCRA17FE007B"
            - "ATFCSH17FC007B"
            - "STCFCPA17FC007B,17FE007B"

        # ID.4 – minimální teplota baterie
        - key: battery_temp_min
          device_class: temperature
          state_class: measurement
          accuracy_decimals: 0
          mode: "22"
          pid: "1E0E"
          formula: "a"
          unit: ""
          update_interval: 60s
          pre_commands:
            - "ATSHFC007B"
            - "ATCP17"
            - "ATCRA17FE007B"
            - "ATFCSH17FC007B"
            - "STCFCPA17FC007B,17FE007B"

        # ID.4 – maximální teplota baterie
        - key: battery_temp_max
          device_class: temperature
          state_class: measurement
          accuracy_decimals: 0
          mode: "22"
          pid: "1E0F"
          formula: "a"
          unit: ""
          update_interval: 60s
          pre_commands:
            - "ATSHFC007B"
            - "ATCP17"
            - "ATCRA17FE007B"
            - "ATFCSH17FC007B"
            - "STCFCPA17FC007B,17FE007B"
