templates:
  - id: jaalee_jht
    name: "Jaalee JHT"
    description: "Temperature / humidity / battery (iBeacon, Apple manufacturer 76)"
    device:
      id: jaalee_jht
      name: "Jaalee JHT"
      source: advertisement
      instance_mode: mac
      match:
        manufacturer_id: 76
        manufacturer_min_length: 24
        manufacturer_hex_prefix: "0215"
      sensors:
        - key: temperature
          device_class: temperature
          unit: "°C"
          state_class: measurement
          accuracy_decimals: 2
          source_field: manufacturer_data
          decode: { offset: 18, length: 2, type: uint16, endian: big, scale: 0.002670288, offset_value: -45 }
        - key: humidity
          device_class: humidity
          unit: "%"
          state_class: measurement
          accuracy_decimals: 2
          source_field: manufacturer_data
          decode: { offset: 20, length: 2, type: uint16, endian: big, scale: 0.001524504 }
        - key: battery
          device_class: battery
          unit: "%"
          state_class: measurement
          source_field: manufacturer_data
          decode: { offset: 23, length: 1, type: uint8 }

  - id: parking_beacon
    name: "Parking Beacon"
    description: "Shared parking beacon (manufacturer 861 / 0x035D)"
    device:
      id: parking_beacon
      name: "Parking Beacon"
      source: advertisement
      instance_mode: shared
      match:
        manufacturer_id: 861
      sensors:
        - key: parking_time
          device_class: timestamp
          icon: mdi:clock-time-four-outline
          source_field: manufacturer_data
          length: 14
          decode: { offset: 7, length: 4, type: timestamp }
        - key: parking_floor
          icon: mdi:layers-outline
          source_field: manufacturer_data
          length: 14
          accuracy_decimals: 0
          decode: { offset: 11, length: 1, type: uint8, scale: -1, offset_value: 256 }
        - key: parking_location
          platform: text_sensor
          icon: mdi:map-marker-outline
          source_field: manufacturer_data
          length: 14
          decode: { offset: 12, length: 2, type: string }

  - id: obd_standard
    name: "OBD-II (standard PIDs)"
    description: "RPM, speed, coolant, fuel — bind ELM327 adapter in app"
    device:
      id: obd_vehicle
      name: "OBD Vehicle"
      source: obd
      obd:
        service_uuid: "FFF0"
        tx_char_uuid: "FFF2"
        rx_char_uuid: "FFF1"
        tx_delay: 50ms
        init_commands: []
      sensors:
        - { key: rpm, preset: rpm, update_interval: 1s }
        - { key: speed, preset: speed, update_interval: 1s }
        - { key: coolant_temp, preset: coolant_temp, update_interval: 10s }
        - { key: fuel_level, preset: fuel_level, update_interval: 60s }

  - id: obd_gm_extended
    name: "OBD-II + GM extensions"
    description: "Standard PIDs plus GM mode-22 sensors (ATSP6 init)"
    device:
      id: car_obd
      name: "Vehicle OBD"
      source: obd
      obd:
        service_uuid: "18F0"
        tx_char_uuid: "2AF1"
        rx_char_uuid: "2AF0"
        tx_delay: 50ms
        init_commands: ["ATSP6"]
      sensors:
        - { key: rpm, preset: rpm, update_interval: 1s }
        - { key: speed, preset: speed, update_interval: 1s }
        - { key: coolant_temp, preset: coolant_temp, update_interval: 10s }
        - key: fuel_level
          preset: fuel_level
          update_interval: 60s
          publish: { deadband: 0.5, min_interval: 60s }
        - { key: gear, preset: gm_current_gear, update_interval: 2s }
        - { key: prnd, preset: gm_prnd_status_alt, update_interval: 2s }
        - { key: oil_pressure, preset: gm_oil_pressure, update_interval: 5s }
        - { key: trans_temp, preset: gm_trans_temp, update_interval: 10s }

  - id: obd_hyundai_kia
    name: "OBD-II + 현대/기아 계기판"
    description: "RPM, 속도, 총 주행거리, 연료잔량(L), 계기판 전압 — 계기판 7C6 / 22B002"
    device:
      id: car_obd_hk
      name: "Hyundai/Kia OBD"
      source: obd
      obd:
        service_uuid: "18F0"
        tx_char_uuid: "2AF1"
        rx_char_uuid: "2AF0"
        tx_delay: 50ms
        init_commands: ["ATSP6"]
      sensors:
        - { key: rpm, preset: rpm, update_interval: 1s }
        - { key: speed, preset: speed, update_interval: 1s }
        - key: odometer
          mode: "22"
          pid: "B002"
          pre_commands: ["ATSH7C6"]
          formula: "g*65536+h*256+i"
          unit: "km"
          device_class: distance
          state_class: total_increasing
          accuracy_decimals: 0
          icon: mdi:counter
          update_interval: 60s
        - key: fuel_level
          mode: "22"
          pid: "B002"
          pre_commands: ["ATSH7C6"]
          formula: "e*0.5"
          unit: "L"
          state_class: measurement
          accuracy_decimals: 1
          icon: mdi:gas-station
          update_interval: 60s
          publish: { deadband: 0.5, min_interval: 60s }
        - key: cluster_voltage
          mode: "22"
          pid: "B002"
          pre_commands: ["ATSH7C6"]
          formula: "f*0.078125"
          unit: "V"
          device_class: voltage
          state_class: measurement
          accuracy_decimals: 2
          entity_category: diagnostic
          update_interval: 120s

  - id: obd_hyundai_accent_rb_diesel
    name: "OBD-II 엑센트(RB) 디젤"
    description: "RPM, 속도, 연료 %, 흡기온도, 대기압 + 총주행거리 프로브 — 엑센트 RB 1.6 TCI-U2"
    device:
      id: car_obd_accent
      name: "Accent RB Diesel"
      source: obd
      obd:
        service_uuid: "18F0"
        tx_char_uuid: "2AF1"
        rx_char_uuid: "2AF0"
        tx_delay: 50ms
        init_commands: ["ATSP6"]
      sensors:
        - { key: rpm, preset: rpm, update_interval: 1s }
        - { key: speed, preset: speed, update_interval: 1s }
        - key: intake_temp
          mode: "21"
          pid: "01"
          pre_commands: ["ATSH7E0"]
          formula: "k*0.980392-50"
          unit: "°C"
          device_class: temperature
          state_class: measurement
          accuracy_decimals: 1
          update_interval: 20s
        - key: barometric_pressure
          mode: "21"
          pid: "01"
          pre_commands: ["ATSH7E0"]
          formula: "j*1.372549"
          unit: "kPa"
          device_class: pressure
          state_class: measurement
          accuracy_decimals: 1
          update_interval: 60s
        - key: odometer
          mode: "21"
          pid: "03"
          pre_commands: ["ATSH7E0"]
          decode: { offset: 57, length: 4, type: uint32, endian: big, scale: 0.000992723 }
          unit: "km"
          device_class: distance
          state_class: total_increasing
          accuracy_decimals: 1
          icon: mdi:counter
          update_interval: 300s
        - key: odometer_at_last_dpf_regen
          mode: "21"
          pid: "03"
          pre_commands: ["ATSH7E0"]
          decode: { offset: 49, length: 4, type: uint32, endian: big, scale: 0.000992723 }
          unit: "km"
          device_class: distance
          state_class: total_increasing
          accuracy_decimals: 1
          entity_category: diagnostic
          update_interval: 300s
        - key: distance_since_dpf_regen
          mode: "21"
          pid: "03"
          pre_commands: ["ATSH7E0"]
          decode: { offset: 53, length: 4, type: uint32, endian: big, scale: 0.000992723 }
          unit: "km"
          device_class: distance
          state_class: measurement
          accuracy_decimals: 1
          entity_category: diagnostic
          update_interval: 300s
        - key: odometer_flow_control
          mode: "22"
          pid: "B002"
          pre_commands: ["ATSH7C6", "ATFCSH7C6", "ATFCSD300000", "ATFCSM1"]
          formula: "g*65536+h*256+i"
          unit: "km"
          device_class: distance
          state_class: total_increasing
          accuracy_decimals: 0
          entity_category: diagnostic
          update_interval: 300s
        - key: tcu_byte0
          mode: "21"
          pid: "A0"
          pre_commands: ["ATSH7E1"]
          decode: { offset: 0, length: 1, type: uint8 }
          entity_category: diagnostic
          update_interval: 2s
        - key: tcu_byte1
          mode: "21"
          pid: "A0"
          pre_commands: ["ATSH7E1"]
          decode: { offset: 1, length: 1, type: uint8 }
          entity_category: diagnostic
          update_interval: 2s
        - key: tcu_byte2
          mode: "21"
          pid: "A0"
          pre_commands: ["ATSH7E1"]
          decode: { offset: 2, length: 1, type: uint8 }
          entity_category: diagnostic
          update_interval: 2s
        - key: tcu_byte3
          mode: "21"
          pid: "A0"
          pre_commands: ["ATSH7E1"]
          decode: { offset: 3, length: 1, type: uint8 }
          entity_category: diagnostic
          update_interval: 2s

  - id: gatt_meter_relay
    name: "GATT power meter + relay"
    description: "Notify characteristic + switch control example"
    device:
      id: custom_meter
      name: "Custom BLE Meter"
      source: gatt_notify
      gatt:
        service_uuid: "ffe0"
        notify_char_uuid: "ffe1"
        write_char_uuid: "ffe2"
      sensors:
        - key: power
          unit: "W"
          device_class: power
          state_class: measurement
          decode: { offset: 0, length: 2, type: uint16, endian: little }
      controls:
        - key: relay
          type: switch
          command: { on: "A10100", off: "A10000" }

  # ── Nová šablona pro Volkswagen ID.4 ─────────────────────────────
 # ── Šablona pro Volkswagen ID.4 (OBDLink CX) ─────────────────────
  - id: obd_vw_id4
    name: "VW ID.4 (OBDLink CX)"
    description: "SoC, napětí, proud, teploty HV baterie pro VW ID.4 přes OBDLink CX"
    device:
      id: vw_id4_obd
      name: "VW ID.4 OBD"
      source: obd
      obd:
        service_uuid: "E7810A71-73AE-499D-8C15-FAA9AEF0C3F2"
        tx_char_uuid: "E7810A72-73AE-499D-8C15-FAA9AEF0C3F2"
        rx_char_uuid: "E7810A73-73AE-499D-8C15-FAA9AEF0C3F2"
        tx_delay: 50ms
        init_commands: ["ATSP6"]
      sensors:
        - key: "speed"
          device_class: "speed"
          unit: "km/h"
          state_class: "measurement"
          icon: "mdi:speedometer"
          accuracy_decimals: 0
          preset: "speed"
          pid: "0D"
          formula: "a"
          update_interval: "1s"

        - key: "battery_voltage"
          device_class: "voltage"
          unit: "V"
          state_class: "measurement"
          accuracy_decimals: 2
          preset: "battery_voltage"
          pid: "42"
          formula: "(a*256+b)/1000"
          update_interval: "10s"

        - key: "battery_soc_real"
          device_class: "battery"
          unit: "%"
          state_class: "measurement"
          accuracy_decimals: 1
          mode: "22"
          pid: "028C"
          pre_commands: ["ATSH7E4"]
          formula: "a*0.39215686"
          update_interval: "10s"

        - key: "battery_soc_display"
          device_class: "battery"
          unit: "%"
          state_class: "measurement"
          accuracy_decimals: 1
          mode: "22"
          pid: "1002"
          pre_commands: ["ATSH7E4"]
          formula: "a*0.5"
          update_interval: "10s"

        - key: "hv_battery_voltage"
          device_class: "voltage"
          unit: "V"
          state_class: "measurement"
          accuracy_decimals: 1
          mode: "22"
          pid: "1E3B"
          pre_commands: ["ATSH7E4"]
          formula: "(a*256+b)*0.25"
          update_interval: "5s"

        - key: "hv_battery_current"
          device_class: "current"
          unit: "A"
          state_class: "measurement"
          accuracy_decimals: 1
          mode: "22"
          pid: "1E3D"
          pre_commands: ["ATSH7E4"]
          formula: "((a*256+b)-15000)*0.1"
          update_interval: "2s"

        - key: "battery_temp_min"
          device_class: "temperature"
          unit: "°C"
          state_class: "measurement"
          accuracy_decimals: 1
          mode: "22"
          pid: "1E0E"
          pre_commands: ["ATSH7E4"]
          formula: "a-40"
          update_interval: "30s"

        - key: "battery_temp_max"
          device_class: "temperature"
          unit: "°C"
          state_class: "measurement"
          accuracy_decimals: 1
          mode: "22"
          pid: "1E0F"
          pre_commands: ["ATSH7E4"]
          formula: "a-40"
          update_interval: "30s"

        - key: "odometer"
          device_class: "distance"
          unit: "km"
          state_class: "total_increasing"
          accuracy_decimals: 0
          icon: "mdi:counter"
          mode: "22"
          pid: "2203"
          pre_commands: ["ATSH17FC007B"]
          formula: "(a*16777216+b*65536+c*256+d)/10"
          update_interval: "120s"
          pid: "2203"
          pre_commands: ["ATSH17FC007B"]
          formula: "(a*16777216+b*65536+c*256+d)/10"
          update_interval: "120s"
