templates:
  - id: obd_link_cx
    name: "OBDlink CX (VW ID.4 GTX)"
    description: "SoC a data baterie pro MEB platformu přes ECU 7E4"
    device:
      id: obd_vehicle
      name: "OBDlink CX"
      source: obd
      obd:
      tx_delay: 50ms
      init_commands:
        - "ATSP7"
        - "ATSHFC007B"
        - "ATCP17"
        - "ATCRA17FE007B"
        - "ATFCSH17FC007B"
        - "STCFCPA17FC007B,17FE007B"
        
      sensors:

        # ID.4 – skutečný SoC baterie
        - key: "battery_soc"
        mode: "22"
        pid: "028C"
        decode:
          offset: 0
          length: 1
          type: uint8
          scale: 0.448
          offset_value: -7.16
        unit: "%"
        device_class: battery
        state_class: measurement
        accuracy_decimals: 1
        icon: "mdi:battery-high"
        update_interval: 10s
        pre_commands:
          - "ATSHFC007B"
          - "ATCP17"
          - "ATCRA17FE007B"
          - "ATFCSH17FC007B"
          - "STCFCPA17FC007B,17FE007B"
          
        # ID.4 – SoC zobrazovaný vozem
        - key: battery_soc_display
          device_class: battery
          unit: "%"
          state_class: measurement
          accuracy_decimals: 1
          mode: "22"
          pid: "1002"
          decode:
            offset: 0
            length: 1
            type: uint8
            scale: 0.448
            offset_value: -7.16
          pre_commands:
          - "ATSHFC007B"
          - "ATCP17"
          - "ATCRA17FE007B"
          - "ATFCSH17FC007B"
          - "STCFCPA17FC007B,17FE007B"

          update_interval: 10s

        # ID.4 – napětí HV baterie
        - key: hv_battery_voltage
          device_class: voltage
          unit: "V"
          state_class: measurement
          accuracy_decimals: 1
          mode: "22"
          pid: "1E3B"
          pre_commands:
          - "ATSHFC007B"
          - "ATCP17"
          - "ATCRA17FE007B"
          - "ATFCSH17FC007B"
          - "STCFCPA17FC007B,17FE007B"

          update_interval: 5s

        # ID.4 – proud HV baterie
        - key: hv_battery_current
          device_class: current
          unit: "A"
          state_class: measurement
          accuracy_decimals: 1
          mode: "22"
          pid: "1E3D"
          pre_commands:
          - "ATSHFC007B"
          - "ATCP17"
          - "ATCRA17FE007B"
          - "ATFCSH17FC007B"
          - "STCFCPA17FC007B,17FE007B"

          update_interval: 2s

        # ID.4 – minimální teplota baterie
        - key: battery_temp_min
          device_class: temperature
          unit: "°C"
          state_class: measurement
          accuracy_decimals: 1
          mode: "22"
          pid: "1E0E"
          pre_commands:
          - "ATSHFC007B"
          - "ATCP17"
          - "ATCRA17FE007B"
          - "ATFCSH17FC007B"
          - "STCFCPA17FC007B,17FE007B"

          update_interval: 30s

        # ID.4 – maximální teplota baterie
        - key: battery_temp_max
          device_class: temperature
          unit: "°C"
          state_class: measurement
          accuracy_decimals: 1
          mode: "22"
          pid: "1E0F"
          pre_commands:
          - "ATSHFC007B"
          - "ATCP17"
          - "ATCRA17FE007B"
          - "ATFCSH17FC007B"
          - "STCFCPA17FC007B,17FE007B"

          update_interval: 30s
