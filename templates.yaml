templates:
  - id: obd_link_cx
    name: "OBDlink CX (VW ID.4)"
    description: "SoC a data baterie pro MEB platformu přes ECU 7E4"
    device:
      id: obd_vehicle
      name: "OBDlink CX"
      source: obd
      obd:
        tx_delay: 100ms
        init_commands:
          - "ATZ"
          - "ATE0"
          - "ATL0"
          - "ATS0"
          - "ATH0"
          - "ATSP6"
          - "ATST64"      # <--- DŮLEŽITÉ: Prodlouží timeout čekání na odpověď ECU (předchází NO DATA)
          - "ATCRA 7E8"
          - "ATSH7E4"
          - "1003"        # <--- KLÍČOVÉ: Otevře UDS Extended Diagnostic Session pro BMS
          - "3E00"        # <--- Tester Present (udrží relaci otevřenou)
      sensors:
        - key: battery_soc_real
          mode: "22"
          pid: "028C"
          formula: "a*0.39215686"
          unit: "%"
          device_class: battery
          state_class: measurement
          accuracy_decimals: 1
          update_interval: 10s
